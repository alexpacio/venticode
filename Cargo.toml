[package]
name = "venticode"
version = "0.3.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace]
members = ["harness", "harness/terminal"]
exclude = ["tui", "tui/browser"]
resolver = "3"

[[bin]]
name = "venticode"
path = "server/src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "uuid", "json", "migrate", "macros"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
futures-util = "0.3"
sha2 = "0.10"
sse-stream = "0.3"
chrono = "0.4"
hmac = "0.12"
subtle = "2"
hex = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
object_store = { version = "0.14.2", features = ["aws"] }

[profile.release]
strip = true
