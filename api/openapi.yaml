openapi: 3.1.0
info:
  title: Venticode API
  version: 0.3.0
  description: |
    Browser API of Venticode, the coding and bot agent that runs tools on
    connected venticode-harness instances.

    Hosts and trust boundary (mirrors the Open WebUI integration in ventic):
    - `POST /api/v1/venticode/access` is served on the portal host and uses the
      portal session plus the exact portal Origin. It returns a one-time ticket.
    - Every other operation is served on the per-workspace host
      `https://<workspace-uuid>.code.<domain>`. The browser posts the ticket to
      `/venticode/bootstrap`, which sets the host-only `venticode_session`
      cookie (HttpOnly, Secure, SameSite=Lax). Mutations require the exact
      Origin of that workspace host. The workspace is always derived from the
      host and the session, never from a request parameter.
    - A standalone instance serves one configured workspace on its own
      origin and issues a session through `/venticode/login`. Its runner
      connects directly to Venticode. Mutations use that exact origin.

    Storage (backend): conversation, project, approval and bot metadata live in
    PostgreSQL; transcripts, tool output and diffs live in S3 (encrypted).
    The Rust service implements this API. Local browser development uses a synthetic mock.
servers:
  - url: /api/v1/venticode
tags:
  - name: session
  - name: inventory
  - name: conversations
  - name: bots
paths:
  /access:
    post:
      operationId: createAccess
      tags: [session]
      summary: Issue a one-time ticket for the workspace host (portal host only)
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url, ticket, expires_in]
                properties:
                  url: { type: string, format: uri, description: Workspace host origin }
                  ticket: { type: string, minLength: 32 }
                  expires_in: { type: integer, example: 60 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /bootstrap:
    servers:
      - url: /venticode
    post:
      operationId: bootstrap
      tags: [session]
      summary: Exchange a ticket for a workspace-host session (Origin must be the portal)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { type: string }
                browser: { type: string, enum: ['1'], description: Open the browser viewer after sign-in }
      responses:
        '303':
          description: Session cookie set; redirect to the application root or browser viewer
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /login:
    servers:
      - url: /venticode
    get:
      operationId: loginPage
      tags: [session]
      summary: Open the standalone sign-in page or the configured Ventic portal
      parameters:
        - name: browser
          in: query
          description: Open the browser viewer after Ventic sign-in
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: Standalone sign-in form
          content:
            text/html:
              schema: { type: string }
        '303':
          description: Redirect to the application or portal
    post:
      operationId: standaloneSignIn
      tags: [session]
      summary: Sign in to a standalone workspace (exact standalone Origin required)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, writeOnly: true }
      responses:
        '303':
          description: Session cookie set and redirect to the workspace
        '401':
          description: Invalid access token
          content:
            text/html:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Error' }
  /session:
    get:
      operationId: getSession
      tags: [session]
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      operationId: signOut
      tags: [session]
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [signed_out, redirect_url]
                properties:
                  signed_out: { type: boolean }
                  redirect_url: { type: string, format: uri }
  /browser-agent:
    get:
      operationId: listBrowserThreads
      summary: List the signed-in user's saved browser conversations
      description: Available in a Ventic workspace with the Kitesurf browser pilot enabled.
      responses:
        '200':
          description: Browser conversations
          content:
            application/json:
              schema:
                type: object
                required: [threads]
                properties:
                  threads:
                    type: array
                    items:
                      type: object
                      required: [id, updated_at]
                      properties:
                        id: { type: string, format: uuid }
                        updated_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /computer:
    get:
      operationId: getComputer
      tags: [inventory]
      summary: Read the current member's computer status without starting it
      responses:
        '200':
          description: Computer status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Computer' }
        '404': { $ref: '#/components/responses/Error' }
  /computer/screen:
    get:
      operationId: connectComputerScreen
      summary: Start or watch the current member's desktop over a same-origin WebSocket
      description: |
        Uses Motion JPEG frame packets with the same framing as /browser-agent/{thread},
        with `tab` set to `desktop`. Client messages are `take`, `release`, `input`
        (`click`, `move`, `pointer`, `scroll`, `text`, or `key`), and `end`.
        The server sends `ready`, `control`, `error`, and `ended` events.
      responses:
        '101': { description: WebSocket upgrade }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /browser-agent/{thread}:
    get:
      operationId: connectBrowser
      summary: Open a Kitesurf session over a same-origin WebSocket
      description: |
        The workspace cookie and exact workspace Origin are required. A new UUID
        starts a new conversation. Reopening a saved conversation restores its
        messages in a fresh browser. Only one connection per conversation can
        run at a time. Closing the socket ends the live browser.

        Client messages are JSON with a `type` of `ask`, `take`, `release`,
        `open`, `new_tab`, `tab`, `input` or `end`. An `input` carries
        the target tab ID and a `click`, `scroll`, `text` or `key` payload.
        Server `tabs` messages identify the active tab. Live Motion JPEG frames
        are binary WebSocket messages with one UTF-8 JSON header followed by a
        newline and the JPEG bytes. The header contains `type: frame`, `tab`,
        `width` and `height` (the remote viewport dimensions used for input).
        Text events are `history`, `ready`, `working`, `idle`, `control`,
        `heartbeat`, `error` and `ended`.
      parameters:
        - name: thread
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '101': { description: WebSocket upgrade }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /models:
    get:
      operationId: listModels
      tags: [session]
      responses:
        '200':
          description: Models the workspace may use
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Model' }
  /harnesses:
    get:
      operationId: listHarnesses
      tags: [inventory]
      summary: Harnesses the user owns or that are shared with them in this workspace
      responses:
        '200':
          description: Inventory
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/Harness' }
        '401': { $ref: '#/components/responses/Error' }
  /harnesses/{id}/ls:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listHarnessDirectory
      tags: [inventory]
      summary: List a directory inside a granted harness root
      description: >
        Read-only directory listing used to browse folders before creating a
        project. The harness must be online and `root` must be one of its
        granted roots. `path` is relative to that root; "." is the root itself.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - in: query
          name: root
          required: true
          schema: { type: string }
        - in: query
          name: path
          required: false
          schema: { type: string, maxLength: 1024, pattern: '^(\.|[^/\\][^\\]*)$' }
      responses:
        '200':
          description: Directory entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryListing' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /projects:
    get:
      operationId: listProjects
      tags: [inventory]
      parameters:
        - in: query
          name: harness_id
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Project folders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
    post:
      operationId: createProject
      tags: [inventory]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      operationId: deleteProject
      tags: [inventory]
      summary: Delete a project and all of its conversations
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      parameters:
        - in: query
          name: project_id
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Conversations, most recently updated first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items: { $ref: '#/components/schemas/Conversation' }
    post:
      operationId: createConversation
      tags: [conversations]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCreate' }
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getConversation
      tags: [conversations]
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateConversation
      tags: [conversations]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteConversation
      tags: [conversations]
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /conversations/{id}/events:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listEvents
      tags: [conversations]
      summary: Replay transcript events after a cursor
      parameters:
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Events in sequence order
          content:
            application/json:
              schema:
                type: object
                required: [items, cursor, state]
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    items: { $ref: '#/components/schemas/Event' }
                  cursor: { type: integer, minimum: 0 }
                  state: { $ref: '#/components/schemas/ConversationState' }
        '404': { $ref: '#/components/responses/Error' }
  /conversations/{id}/stream:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: streamEvents
      tags: [conversations]
      summary: Unbuffered SSE of transcript events after a cursor
      description: |
        Each event is sent as `event: transcript` with `id: <sequence>` and the
        Event JSON as data. `event: heartbeat` is sent every 15 s.
        `event: authorization_expired` ends the stream when the session ends.
        Clients reconnect with `after` set to the last received sequence.
      parameters:
        - $ref: '#/components/parameters/After'
        - name: Last-Event-ID
          in: header
          description: Optional SSE resume cursor; the server resumes after max(after, Last-Event-ID).
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Error' }
  /conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: sendMessage
      tags: [conversations]
      summary: Append a user message and start a run
      description: |
        Idempotent on `id`: replaying the same id with the same content returns
        the original result; a reused id with different content returns 409.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, content]
              properties:
                id: { type: string, format: uuid }
                content: { type: string, minLength: 1, maxLength: 100000 }
                intent: { type: string, enum: [message, goal, plan, answer, implement_plan], default: message }
                reference_id: { type: string, format: uuid, description: Required for answer and implement_plan }
      responses:
        '202':
          description: Run started
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [run_id, message_id]
                properties:
                  run_id: { type: string, format: uuid }
                  message_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /conversations/{id}/goal/{goal_id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: goal_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: cancelGoal
      summary: Cancel the active goal while the conversation is idle
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204': { description: Goal cancelled }
        '409': { $ref: '#/components/responses/Error' }
  /conversations/{id}/interrupt:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: interruptRun
      tags: [conversations]
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Run interrupted; pending approvals expire and in-flight tool calls are cancelled
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { $ref: '#/components/schemas/ConversationState' }
  /conversations/{id}/sessions/{call_id}/input:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {in: path, name: call_id, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: sendHarnessSessionInput
      parameters: [{$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, action]
              properties:
                id: {type: string, format: uuid}
                action: {type: string, enum: [send, stop]}
                text: {type: string, maxLength: 8192}
      responses:
        '202': {description: Input queued for the current member's live harness session}
        '409': {$ref: '#/components/responses/Error'}
  /approvals/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: decideApproval
      tags: [conversations]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { $ref: '#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { $ref: '#/components/schemas/ApprovalState' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /bots:
    get:
      operationId: listBots
      tags: [bots]
      responses:
        '200':
          description: Bots of this workspace
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Bot' }
  /bots/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getBot
      tags: [bots]
      responses:
        '200':
          description: Bot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bot' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateBot
      tags: [bots]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BotUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bot' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /bots/{id}/mentions:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listMentions
      tags: [bots]
      responses:
        '200':
          description: Mentions of the bot, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/Mention' }
  /bots/{id}/mentions/{mention_id}/review:
    parameters:
      - $ref: '#/components/parameters/Id'
      - in: path
        name: mention_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reviewMention
      tags: [bots]
      summary: Approve and post, or discard, a reply that is held for review
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, discard] }
      responses:
        '200':
          description: Review recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mention' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /connections:
    get:
      operationId: listConnections
      responses:
        '200':
          description: Verified channel bindings visible to this workspace
          content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Connection'}}}}}}
    post:
      operationId: connectChannel
      parameters: [{$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConnectionSetup'}}}
      responses:
        '201': {$ref: '#/components/responses/ConnectionResult'}
  /connections/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      operationId: disconnectChannel
      parameters: [{$ref: '#/components/parameters/Origin'}]
      responses: {'200': {$ref: '#/components/responses/Deleted'}}
    put:
      operationId: rotateChannel
      parameters: [{$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConnectionSetup'}}}
      responses: {'200': {$ref: '#/components/responses/ConnectionResult'}}
  /connections/{id}/link:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      operationId: unlinkExternalIdentity
      parameters: [{$ref: '#/components/parameters/Origin'}]
      responses: {'200': {$ref: '#/components/responses/Deleted'}}
    post:
      operationId: linkExternalIdentity
      parameters: [{$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_user_id]
              properties: {external_user_id: {type: string}}
      responses:
        '200':
          description: One-time challenge to submit from the named provider account
          content:
            application/json:
              schema:
                type: object
                required: [command, expires_in]
                properties:
                  command: {type: string}
                  expires_in: {type: integer}
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    After:
      in: query
      name: after
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    TenantId:
      in: header
      name: X-Tenant-Id
      required: false
      schema: { type: string, format: uuid }
    Origin:
      in: header
      name: Origin
      required: true
      description: Exact origin of the workspace host
      schema: { type: string }
  responses:
    ConnectionResult:
      description: Connection details or a Slack authorization redirect
      content:
        application/json:
          schema:
            oneOf:
              - {$ref: '#/components/schemas/Connection'}
              - type: object
                required: [id, authorize_url, webhook_url]
                properties:
                  id: {type: string, format: uuid}
                  authorize_url: {type: string, format: uri}
                  webhook_url: {type: string, format: uri}
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Deleted:
      description: Deleted
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [deleted]
            properties:
              deleted: { type: boolean }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message: { type: string }
    Connection:
      type: object
      required: [id, kind, destination, project_id, status, webhook_url]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [slack, telegram, gitlab]}
        destination: {type: string}
        identity: {type: string}
        linked_user_id: {type: [string, "null"], description: Current member’s linked provider identity}
        status: {type: string, enum: [pending, connected, disconnected]}
        webhook_url: {type: string, format: uri}
        project_id: {type: [string, "null"], format: uuid}
        runtime: { $ref: '#/components/schemas/BotRuntime' }
    ConnectionSetup:
      type: object
      additionalProperties: false
      required: [kind, destination, credentials]
      properties:
        kind: {type: string, enum: [slack, telegram, gitlab]}
        destination: {type: string, description: 'Slack channel ID, Telegram chat ID or GitLab numeric project ID'}
        project_id: {type: [string, "null"], format: uuid}
        runtime: { $ref: '#/components/schemas/BotRuntime' }
        credentials:
          type: object
          additionalProperties: false
          properties:
            token: {type: string, writeOnly: true}
            client_id: {type: string}
            client_secret: {type: string, writeOnly: true}
            signing_secret: {type: string, writeOnly: true}
    Session:
      type: object
      additionalProperties: false
      required: [user, workspace, portal_url, role]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string }
        workspace:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        role: { type: string, enum: [tenant_admin, reseller_admin, group_manager, member] }
        portal_url: { type: string, format: uri }
        standalone: { type: boolean, description: Session issued by a standalone Venticode instance }
        bot_runtimes:
          type: array
          items: { $ref: '#/components/schemas/BotRuntime' }
    Model:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        default: { type: boolean }
        tools: { type: boolean, description: Tool calling is available for this model and member }
        vision: { type: boolean, description: Image input is available for this model and member }
        efforts: { type: array, description: Reasoning effort levels supported by this model; empty = not supported, items: { $ref: '#/components/schemas/Effort' } }
    BotRuntime:
      type: string
      enum: [project, kitesurf, computer]
    Computer:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [stopped, starting, ready] }
        harness_id: { type: string, format: uuid }
    HarnessOperation:
      type: string
      enum: [list_files, find_files, search_files, read_file, write_file, edit_file, mkdir, rename, remove, execute, terminal_start, agent_start, mcp_list_servers, mcp_list_tools, mcp_call_tool, preview, browser_tabs, browser_new_tab, browser_select_tab, browser_open, browser_snapshot, browser_follow_link, browser_open_preview, desktop_screenshot, desktop_act, project_service_start, ask_model]
    DirectoryEntry:
      type: object
      additionalProperties: false
      required: [name, directory, symlink, bytes]
      properties:
        name: { type: string }
        directory: { type: boolean }
        symlink: { type: boolean }
        bytes: { type: integer }
    DirectoryListing:
      type: object
      additionalProperties: false
      required: [items, path]
      properties:
        items:
          type: array
          maxItems: 4096
          items: { $ref: '#/components/schemas/DirectoryEntry' }
        path: { type: string, description: 'Normalized relative path that was listed' }
    Harness:
      type: object
      additionalProperties: false
      required: [id, name, roots, online, mode, owned, revision]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        roots:
          type: array
          description: Granted root labels on the harness
          items: { type: string }
        online: { type: boolean }
        mode: { type: string, enum: [sandboxed, yolo] }
        owned: { type: boolean }
        revision: { type: integer }
        managed: { type: boolean }
        model_access: { type: boolean }
        host_info:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [os, arch, version]
              properties:
                os: { type: string }
                arch: { type: string }
                version: { type: string }
                hostname: { type: string }
        mcp_servers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, transport, tools, status]
            properties:
              name: { type: string }
              transport: { type: string, enum: [stdio, http] }
              tools: { type: integer, minimum: 0 }
              status: { type: string, enum: [running, stopped, auth_required] }
    Project:
      type: object
      additionalProperties: false
      required: [id, harness_id, root, path, name, created_at]
      properties:
        id: { type: string, format: uuid }
        harness_id: { type: string, format: uuid }
        root: { type: string, description: Granted root label }
        path: { type: string, description: 'Relative folder inside the root; "." is the root itself' }
        name: { type: string }
        created_at: { type: string, format: date-time }
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [harness_id, root]
      properties:
        harness_id: { type: string, format: uuid }
        root: { type: string }
        path: { type: string, maxLength: 1024, pattern: '^(\.|[^/\\][^\\]*)$', default: '.' }
        name: { type: string, minLength: 1, maxLength: 80 }
    PermissionMode:
      type: string
      enum: [ask, auto_edit, plan]
      description: ask = every write and command asks; auto_edit = file edits run, commands ask; plan = read-only tools only
    Effort:
      type: string
      enum: [none, low, medium, high]
      default: medium
      description: Reasoning/thinking effort passed to the model. none = no extra thinking; low/medium/high = increasing thinking budget
    ConversationState:
      type: string
      enum: [idle, running, waiting, failed]
    Conversation:
      type: object
      additionalProperties: false
      required: [id, project_id, harness_id, title, model, effort, permission_mode, state, revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        goal_id: { type: [string, "null"], format: uuid }
        question_id: { type: [string, "null"], format: uuid }
        plan_id: { type: [string, "null"], format: uuid }
        project_id: { type: [string, 'null'], format: uuid }
        harness_id: { type: [string, 'null'], format: uuid }
        runtime: { $ref: '#/components/schemas/BotRuntime' }
        title: { type: string }
        model: { type: string }
        effort: { $ref: '#/components/schemas/Effort' }
        permission_mode: { $ref: '#/components/schemas/PermissionMode' }
        state: { $ref: '#/components/schemas/ConversationState' }
        revision: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ConversationCreate:
      type: object
      additionalProperties: false
      required: [project_id]
      properties:
        project_id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        model: { type: string }
        effort: { $ref: '#/components/schemas/Effort' }
        permission_mode: { $ref: '#/components/schemas/PermissionMode' }
    ConversationUpdate:
      type: object
      additionalProperties: false
      required: [revision]
      minProperties: 2
      properties:
        revision: { type: integer }
        title: { type: string, minLength: 1, maxLength: 200 }
        model: { type: string }
        effort: { $ref: '#/components/schemas/Effort' }
        permission_mode: { $ref: '#/components/schemas/PermissionMode' }
    ApprovalDecision:
      type: string
      enum: [allow_once, allow_project, deny]
    ApprovalState:
      type: string
      enum: [pending, allowed, denied, expired]
    Diff:
      type: object
      additionalProperties: false
      required: [path, additions, deletions, patch]
      properties:
        path: { type: string }
        additions: { type: integer, minimum: 0 }
        deletions: { type: integer, minimum: 0 }
        patch: { type: string, description: Unified diff, truncated to 64 KiB (full copy in S3) }
    Todo:
      type: object
      additionalProperties: false
      required: [content, status]
      properties:
        content: { type: string }
        status: { type: string, enum: [pending, in_progress, completed] }
    Event:
      type: object
      description: One transcript entry. Fields beyond the common ones depend on `type`.
      required: [sequence, type, created_at]
      properties:
        sequence: { type: integer, minimum: 1 }
        type: { type: string, enum: [user_message, text, reasoning, tool_call, tool_output, tool_result, approval, todo, run, error, question, plan, goal_completed, goal_cancelled] }
        created_at: { type: string, format: date-time }
        message_id: { type: string, format: uuid, description: 'user_message, text' }
        content: { type: string, description: 'user_message: full text' }
        intent: { type: string, enum: [message, goal, plan, answer, implement_plan] }
        reference_id: { type: string, format: uuid }
        options: { type: array, items: { type: string } }
        delta: { type: string, description: 'text/reasoning: appended to the message with the same message_id' }
        call_id: { type: string, format: uuid, description: 'tool_call, tool_output, tool_result, approval' }
        operation: { $ref: '#/components/schemas/HarnessOperation' }
        target: { type: string, description: 'tool_call: path, command or MCP tool shown to the user' }
        arguments: { type: object, description: 'tool_call: operation arguments' }
        stream: { type: string, enum: [stdout, stderr] }
        data: { type: string, description: 'tool_output: text chunk' }
        interactive: {type: string, enum: [terminal, agent], description: A live session open for member input}
        status: { type: string, enum: [ok, error, denied, cancelled], description: 'tool_result' }
        summary: { type: string, description: 'tool_result, approval' }
        diff: { $ref: '#/components/schemas/Diff' }
        approval_id: { type: string, format: uuid }
        approval_state: { $ref: '#/components/schemas/ApprovalState' }
        todos:
          type: array
          items: { $ref: '#/components/schemas/Todo' }
        run_id: { type: string, format: uuid }
        model_call: { type: string, format: uuid, description: Identifier for a completion from the computer CLI }
        model: { type: string }
        model_usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
        state: { $ref: '#/components/schemas/ConversationState' }
        usage:
          type: object
          additionalProperties: false
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            context_ratio: { type: number, minimum: 0, maximum: 1 }
        message: { type: string, description: 'error' }
    ToolPolicy:
      type: string
      enum: [auto, review, off]
    BotTriggers:
      type: object
      additionalProperties: false
      required: [mentions, direct_messages]
      properties:
        mentions: { type: boolean }
        direct_messages: { type: boolean }
    BotTools:
      type: object
      additionalProperties: false
      required: [read, write, execute, mcp]
      properties:
        read: { $ref: '#/components/schemas/ToolPolicy' }
        write: { $ref: '#/components/schemas/ToolPolicy' }
        execute: { $ref: '#/components/schemas/ToolPolicy' }
        mcp: { $ref: '#/components/schemas/ToolPolicy' }
    Bot:
      type: object
      additionalProperties: false
      required: [id, name, handle, harness_id, root, enabled, revision, channels, triggers, tools, instructions, rate_limit_per_hour]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        handle: { type: string, const: '@ventic', description: Mention handle used in every channel }
        harness_id: { type: [string, 'null'], format: uuid }
        root: { type: [string, 'null'] }
        runtime: { $ref: '#/components/schemas/BotRuntime' }
        enabled: { type: boolean }
        revision: { type: integer }
        channels:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, name]
            properties:
              kind: { type: string, enum: [slack, telegram, gitlab] }
              name: { type: string }
        triggers: { $ref: '#/components/schemas/BotTriggers' }
        tools: { $ref: '#/components/schemas/BotTools' }
        instructions: { type: string, maxLength: 8000 }
        rate_limit_per_hour: { type: integer, minimum: 1, maximum: 1000 }
    BotUpdate:
      type: object
      additionalProperties: false
      required: [revision]
      minProperties: 2
      properties:
        revision: { type: integer }
        runtime: { $ref: '#/components/schemas/BotRuntime' }
        enabled: { type: boolean }
        triggers: { $ref: '#/components/schemas/BotTriggers' }
        tools: { $ref: '#/components/schemas/BotTools' }
        instructions: { type: string, maxLength: 8000 }
        rate_limit_per_hour: { type: integer, minimum: 1, maximum: 1000 }
    Mention:
      type: object
      additionalProperties: false
      required: [id, channel, author, text, state, created_at, tool_calls]
      properties:
        id: { type: string, format: uuid }
        channel:
          type: object
          additionalProperties: false
          required: [kind, name]
          properties:
            kind: { type: string, enum: [slack, telegram, gitlab] }
            name: { type: string }
        author: { type: string }
        text: { type: string }
        state: { type: string, enum: [answering, replied, review, discarded, sending, uncertain, failed] }
        reply: { type: [string, "null"] }
        conversation_id: {type: [string, "null"], format: uuid}
        tool_calls:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [operation, target, status]
            properties:
              operation: { $ref: '#/components/schemas/HarnessOperation' }
              target: { type: string }
              status: { type: string, enum: [ok, error, held] }
        created_at: { type: string, format: date-time }
        replied_at: { type: string, format: date-time }
