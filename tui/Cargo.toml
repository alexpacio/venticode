[package]
name = "venticode-tui"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
crossterm = {version="0.29", features=["event-stream"]}
reqwest = {version="0.12",default-features=false,features=["json","rustls-tls-native-roots","stream"]}
futures-util = "0.3"
axum = "0.8"
open = "5"
keyring = {version="3.6.3",features=["windows-native","apple-native","sync-secret-service","crypto-rust","vendored"]}
rpassword = "7"
serde_json = "1"
sse-stream = "0.3"
tokio = {version="1",features=["macros","rt-multi-thread","time","sync"]}
uuid = {version="1",features=["v4"]}
unicode-segmentation = "1"
ftui = { version = "=0.9.0", default-features = false, features = ["runtime", "crossterm"] }
ftui-extras = { version = "=0.9.0", default-features = false, features = ["markdown"] }

[profile.release]
incremental = true
strip = true
