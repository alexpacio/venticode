[package]
name = "venticode-tui"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
arboard = "3.6.1"
asupersync = { version = "0.6.2", default-features = false, features = ["runtime-core", "native-runtime", "tls", "tls-native-roots", "tls-webpki-roots"] }
crossterm = "0.29"
ctrlc = "3.5.2"
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust", "vendored"] }
open = "5"
rich_rust = { version = "0.2.3", features = ["markdown"] }
rpassword = "7"
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zune-core = "0.5"
zune-jpeg = "0.5"
unicode-segmentation = "1"
ftui = { version = "=0.9.0", default-features = false, features = ["runtime", "crossterm"] }
ftui-extras = { version = "=0.9.0", default-features = false, features = ["markdown"] }
minisign-verify = "0.3.0"
sha2 = "0.10"
semver = "1"

[profile.release]
strip = true
