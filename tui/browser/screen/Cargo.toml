[package]
name = "venticode-remote-screen"
version = "0.3.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = {version="=0.34.3", default-features=false, features=["glow"]}
js-sys = "0.3"
serde_json = "1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = {version="0.3", features=["HtmlCanvasElement"]}
