[package]
name = "venticode-tui-browser"
version = "0.3.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
ftui = {version="=0.9.0", default-features=false}
ftui-extras = {version="=0.9.0", default-features=false, features=["markdown"]}
js-sys = "0.3"
serde_json = "1"
unicode-segmentation = "1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = {version="0.3", features=["BinaryType", "Crypto", "EventSource", "Headers", "Location", "MessageEvent", "Request", "RequestCredentials", "RequestInit", "RequestRedirect", "Response", "WebSocket", "Window"]}

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
