[package]
name = "venticode-tui-browser"
version = "0.3.0"
edition = "2024"
publish = false

[workspace]
members = ["screen"]
resolver = "3"

[lib]
crate-type = ["cdylib"]

[dependencies]
ftui = {version="=0.9.0", default-features=false}
ftui-extras = {version="=0.9.0", default-features=false, features=["markdown"]}
wasm-bindgen = "=0.2.129"
serde = {version="1", features=["derive"]}
serde_json = "1"
unicode-segmentation = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
