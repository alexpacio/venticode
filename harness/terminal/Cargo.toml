[package]
name = "ventiharness-terminal"
version = "1.0.0"
edition = "2024"
license = "UNLICENSED"

[dependencies]
anyhow = "1"
base64 = "0.22"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
hex = "0.4"
ignore = "=0.4.33"
portable-pty = "=0.9.0"
process-wrap = { version = "=10.0.1", features = ["tokio1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
