[package]
name = "venticode-harness"
default-run = "venticode-harness"
version = "0.3.0"
edition = "2024"
publish = false

[features]
ventic-relay = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
flate2 = "1"
tar = { version = "0.4", default-features = false }
cap-std = "=4.0.3"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
htmd = "0.5.5"
json5 = "0.4"
jsonschema = { version = "0.49.9", default-features = false }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"] }
open = "5"
process-wrap = { version = "=10.0.1", features = ["tokio1"] }
reqwest_mcp = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rich_rust = { version = "0.2.3", features = ["markdown"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
rquickjs = { version = "0.12.2", features = ["loader"] }
regex = "1"
swc_common = "26.0.0"
swc_ecma_codegen = "32.0.0"
swc_ecma_ast = "29.0.0"
swc_ecma_parser = "45.0.0"
swc_ecma_transforms_base = "49.0.0"
swc_ecma_transforms_typescript = "55.0.0"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2.7"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
ventiharness-terminal = { path = "terminal" }
which = "8"
zeroize = "1"
minisign-verify = "0.3.0"
