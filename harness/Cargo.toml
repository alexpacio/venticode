[package]
name = "venticode-harness"
version = "0.3.0"
edition = "2024"
publish = false

[features]
ventic-relay = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
json5 = "0.4"
jsonschema = { version = "0.49.9", default-features = false }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"] }
open = "5"
process-wrap = { version = "=10.0.1", features = ["tokio1"] }
reqwest_mcp = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2.7"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
ventiharness-terminal = { path = "terminal" }
which = "8"
zeroize = "1"
